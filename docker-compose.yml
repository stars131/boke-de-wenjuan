services:
  db:
    image: postgres:16
    container_name: university_podcast_survey_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: university_podcast_survey
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: university_podcast_survey_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/university_podcast_survey
      NEXTAUTH_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
    depends_on:
      - db
    ports:
      - "3000:3000"

volumes:
  postgres_data:
